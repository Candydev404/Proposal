<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        /* Premium Romantic Background and Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #ff7eb3 0%, #ff758c 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Prevents scrollbars when the button runs away */
        }

        .card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .gif-image {
            width: 200px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff4b72;
            font-size: 28px;
            margin-bottom: 30px;
        }

        p {
            color: #ff758c;
            font-size: 18px;
            font-weight: 600;
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        button {
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        #yes-btn {
            background-color: #ff4b72;
            color: white;
            transition: transform 0.2s ease;
        }

        #yes-btn:hover {
            transform: scale(1.05);
        }

        #no-btn {
            background-color: #f1f1f1;
            color: #333;
            /* Smooth animation so it glides away instead of teleporting instantly */
            transition: top 0.3s ease, left 0.3s ease; 
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYzY0ZjlkY2E4Y2Y5Y2Q4ZDU5Y2E4MzY4YmI3OTFjYjY5Y2UyZThmYiZlcD12MV9pbnRlcm5hbF9naWZzX2dpZklkJmN0PWc/KL7xA3fTO7sRXIbmWf/giphy.gif" alt="Pleading Cat" class="gif-image">
        
        <h1>Will you be my girlfriend? 🥺</h1>
        
        <div class="button-container">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const card = document.getElementById('card');

        // Function to make the "No" button run away
        const moveButton = () => {
            // Get the window boundaries
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Subtract the button's own width/height so it doesn't fly off the screen
            const maxX = windowWidth - noBtn.offsetWidth;
            const maxY = windowHeight - noBtn.offsetHeight;

            // Generate random coordinates
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Change position to fixed so it can go anywhere on the screen
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        };

        // Triggers for both mouse (desktop) and touch (mobile)
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton);

        // Success state when she clicks "Yes"
        yesBtn.addEventListener('click', () => {
            card.innerHTML = `
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2FjMzI1Y2M0Y2Y5Y2Q4ZDU5Y2E4MzY4YmI3OTFjYjY5Y2UyZThmYiZlcD12MV9pbnRlcm5hbF9naWZzX2dpZklkJmN0PWc/sIIhZliB2McAo/giphy.gif" alt="Happy Cat" class="gif-image">
                <h1>I knew you'd say Yes! ❤️</h1>
                <p>Get ready for our date!</p>
            `;
        });
    </script>

</body>
</html>
